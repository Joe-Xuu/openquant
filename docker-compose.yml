services:
  db:
    image: postgres:16-alpine
    container_name: openquant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-openquant}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-openquant}
      POSTGRES_DB: ${PG_DB:-openquant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-openquant} -d ${PG_DB:-openquant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  openquant:
    build: .
    container_name: openquant-bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PG_HOST: db
      PG_PORT: 5432
      MONITOR_HOST: 0.0.0.0
      MONITOR_PORT: ${MONITOR_PORT:-8080}
    ports:
      - "${MONITOR_PORT:-8080}:${MONITOR_PORT:-8080}"
    volumes:
      - ./logs:/app/logs
      - ./config/settings.json:/app/config/settings.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${MONITOR_PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
